services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: careertwin-backend
    network_mode: host  # the services below listen on 127.0.0.1 only
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./src:/app/src:ro
      - ./ABOUT.md:/app/ABOUT.md:rw
      - careertwin-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CAREERTWIN_API_TOKEN=${CAREERTWIN_API_TOKEN:-}
      - VNC_PASSWORD=${VNC_PASSWORD:?set VNC_PASSWORD in .env: the browser desktop is protected by it}
      - CAREERTWIN_DB_PATH=/app/data/careertwin.db
      - OUTPUT_DIR=/app/data/outputs
      - CACHE_DIR=/app/data/cache
      - SCREENSHOT_DIR=/app/data/screenshots
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://127.0.0.1:1234/api/v1/chat}
      - LMSTUDIO_API_BASE=${LMSTUDIO_API_BASE:-http://127.0.0.1:1234}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-qwythos-9b-v2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SEARXNG_URL=http://localhost:8888
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - DECISION_BACKEND=${DECISION_BACKEND:-switchyard}
      - DECISION_MODEL=${DECISION_MODEL:-auto}
      - SWITCHYARD_URL=${SWITCHYARD_URL:-http://127.0.0.1:3260}
      - SWITCHYARD_MODEL=${SWITCHYARD_MODEL:-agent}
      - SWITCHYARD_MCP_URL=${SWITCHYARD_MCP_URL:-http://127.0.0.1:3260/mcp}
      - SWITCHYARD_API_KEY=${SWITCHYARD_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: careertwin-searxng
    ports:
      - "127.0.0.1:8888:8080"  # the backend reaches it on the host loopback; nobody else needs to
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET_KEY=careertwin-searxng-secret-key
    restart: unless-stopped
    networks:
      - careertwin

volumes:
  careertwin-data:

networks:
  careertwin:
    driver: bridge
