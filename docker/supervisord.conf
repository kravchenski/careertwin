[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :13 -screen 0 1280x720x24 -ac
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :13 -forever -shared -localhost -passwd %(ENV_VNC_PASSWORD)s -rfbport 5900
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
startsecs=2

[program:novnc]
command=websockify --web=/usr/share/novnc 127.0.0.1:6080 localhost:5900
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
startsecs=3

[program:backend]
command=uvicorn careertwin.api.app:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=2
environment=DISPLAY=":13",AGENT_BROWSER_BIN="/usr/bin/agent-browser",CHROME_FLAGS="--no-sandbox --disable-gpu --disable-dev-shm-usage --disable-setuid-sandbox",PYTHONUNBUFFERED="1"
