[project]
name = "careertwin"
version = "0.1.2"
description = "AI Career Operating System — a personal career agent that understands your experience and builds optimized documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfminer.six>=20231228",
    "python-docx>=1.0",
    "qdrant-client>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "jinja2>=3.1",
    "pypdf>=6.21.2",
    "pdf2image>=1.17",
    "crawl4ai>=0.4",
    "openpyxl>=3.1",
    "mcp>=1.12,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rendering = [
    "weasyprint>=70",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
interview = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "pyside6-essentials>=6.8",
    "soundcard>=0.4.4; sys_platform == 'win32'",
]
gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
]

[project.scripts]
careertwin = "careertwin.cli:main"
careertwin-mcp = "careertwin.agentic.mcp_server:main"
careertwin-interview = "careertwin.interview.app:main"
careertwin-interview-ctl = "careertwin.interview.control:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careertwin"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: marks tests that hit live APIs (deselect with '-m \"not integration\"')",
]

[tool.basedpyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.14"
