[package]
name = "careertwin-overlay"
version = "0.7.0"
edition = "2024"
description = "The interview window of CareerTwin: hears the call, writes what to say, answers the screen"
publish = false

[lib]
name = "careertwin_overlay"
path = "src/lib.rs"

[[bin]]
name = "careertwin-overlay"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "local-stt"]
gui = ["dep:eframe", "dep:egui"]
# Whisper on this computer, through whisper.cpp (needs cmake and a C++ compiler to build).
local-stt = ["dep:whisper-rs"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
egui = { version = "0.37.0", optional = true, default-features = false }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
fancy-regex = "0.18.0"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10.6"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
whisper-rs = { version = "0.16.0", optional = true, features = ["log_backend"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7.20"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
egui = "0.37.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
