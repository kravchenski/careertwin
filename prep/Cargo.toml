[package]
name = "careertwin-prep"
version = "0.1.0"
edition = "2024"
description = "Spoken practice for English, technical and general interviews with a live interviewer"
publish = false

[lib]
name = "careertwin_prep"
path = "src/lib.rs"

[[bin]]
name = "careertwin-prep"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
# Offline speech recognition with whisper.cpp (needs cmake and a C++ compiler to build).
local-stt = ["dep:whisper-rs"]
# Offline voices (Kokoro for English, Qwen3-TTS for many languages) on candle, in pure Rust.
local-tts = ["dep:any-tts"]
local = ["local-stt", "local-tts"]

[dependencies]
any-tts = { version = "0.2.0", optional = true, default-features = false, features = ["kokoro", "qwen3-tts", "download"] }
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
egui = { version = "0.37.0", optional = true, default-features = false }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3.34"
hex = "0.4.3"
hound = "3.5.1"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
toml = "1.1.8"
whisper-rs = { version = "0.16.0", optional = true, features = ["log_backend"] }
uuid = { version = "1.29.0", features = ["v4"] }
regex = "1.13.1"

[dev-dependencies]
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = "0.25.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
