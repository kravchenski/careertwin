name: Nix

# The flake gives NixOS the Rust interview window two ways: the release build made to run there (nothing is
# compiled; nix/release.json names the release) and a build from source, plus a development shell. This builds
# both on a machine with Nix, which is the only way to know the packages still work.
on:
  push:
    branches: [master]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - overlay/**
      - prep/assets/fonts/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - overlay/Cargo.toml
      - overlay/Cargo.lock
      - .github/workflows/nix.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the window with Nix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pin the inputs (when flake.lock is not in the repository yet)
        run: |
          if [ ! -f flake.lock ]; then nix flake lock; echo "flake.lock was made here: commit it" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Evaluate the flake
        run: nix flake check --no-build

      - name: Make the release build run on Nix (nothing is compiled)
        run: nix build .#prebuilt --print-build-logs --out-link result-prebuilt

      - name: The release build starts, says the version nix/release.json names, and finds all its libraries
        run: |
          out=$(./result-prebuilt/bin/careertwin-overlay --version)
          echo "$out"
          version=$(python3 -c 'import json; print(json.load(open("nix/release.json"))["version"])')
          test "$out" = "careertwin-overlay $version"
          ! ldd ./result-prebuilt/bin/.careertwin-overlay-wrapped | grep "not found"
          test -x ./result-prebuilt/bin/careertwin-interview-ctl
          test -f ./result-prebuilt/share/applications/careertwin-interview.desktop
          test -f ./result-prebuilt/share/icons/hicolor/256x256/apps/careertwin-interview.png

      - name: Build the window from source
        run: nix build .#from-source --print-build-logs

      - name: The window built from source starts and says its version
        run: |
          out=$(./result/bin/careertwin-overlay --version)
          echo "$out"
          case "$out" in "careertwin-overlay "*) ;; *) echo "unexpected output: $out"; exit 1 ;; esac
          test -x ./result/bin/careertwin-interview-ctl
          test -f ./result/share/applications/careertwin-interview.desktop
          test -f ./result/share/icons/hicolor/256x256/apps/careertwin-interview.png

      - name: The default package is the release build on this machine
        run: test "$(nix eval --raw .#default.outPath)" = "$(nix eval --raw .#prebuilt.outPath)"

      - name: The development shell works
        run: nix develop --command sh -c 'cargo --version && cmake --version && parec --version'

      - name: Keep the lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake.lock
          path: flake.lock
          if-no-files-found: ignore
          retention-days: 14
