name: Release

# A tag like v0.6.0 builds the Rust interview window for Windows (a portable zip and a setup program), macOS
# (a disk image) and Linux (a tarball), checks each one and publishes them as a GitHub release. Run it by hand
# (Actions -> Release -> Run workflow) to get the files as build artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_overlay.sh
      - packaging/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: Windows zip and setup
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version of the window
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' overlay/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in overlay/Cargo.toml"
            exit 1
          fi

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            overlay/target
          key: release-windows-${{ hashFiles('overlay/Cargo.lock') }}

      - name: Build the window
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release --locked --manifest-path overlay/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

      - name: Pack the folder and the zip
        shell: pwsh
        run: |
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $dir = "build\CareerTwin-Interview"
          New-Item -ItemType Directory -Force -Path $dir, "$dir\data", release | Out-Null
          Copy-Item overlay\target\release\careertwin-overlay.exe $dir
          Copy-Item packaging\windows\careertwin-interview.ico $dir
          Copy-Item packaging\windows\README-Windows.txt $dir
          Set-Content -Path "$dir\data\README.txt" -Value "Your settings, documents and transcripts are kept here."
          Compress-Archive -Path $dir -DestinationPath "release\CareerTwin-Interview-$label-windows-x64.zip"
          Get-ChildItem release | Format-Table Name, Length

      - name: The program reports its version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          $run = Start-Process -FilePath build\CareerTwin-Interview\careertwin-overlay.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $out
          $text = (Get-Content $out -Raw).Trim()
          Write-Host $text
          if ($run.ExitCode -ne 0) { throw "--version exited with $($run.ExitCode)" }
          if ($text -notlike 'careertwin-overlay *') { throw "unexpected output: $text" }
          if ($tag -and $text -ne "careertwin-overlay $tag") { throw "the program says $text but the tag is $tag" }

      - name: Build the setup program
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed" }
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          & $iscc "/DAppVersion=$label" "/DSourceDir=$PWD\build\CareerTwin-Interview" "/O$PWD\release" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem release | Format-Table Name, Length

      - name: Install it, check it, uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'ct-install'
          $run = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", "/LOG=$PWD\setup.log"
          if ($run.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "setup exited with $($run.ExitCode)" }

          foreach ($file in 'careertwin-overlay.exe', 'careertwin-interview.ico', 'data') {
            if (-not (Test-Path "$dir\$file")) { throw "the installation lacks $file" }
          }
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CareerTwin Interview.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -notlike '*careertwin-overlay.exe') { throw "the shortcut starts the wrong thing: $($shortcut.TargetPath)" }

          $out = Join-Path $env:RUNNER_TEMP 'installed.txt'
          $ran = Start-Process -FilePath "$dir\careertwin-overlay.exe" -ArgumentList '--help' -Wait -PassThru -RedirectStandardOutput $out
          if ($ran.ExitCode -ne 0 -or -not ((Get-Content $out -Raw) -match 'CareerTwin Interview')) { throw "the installed program does not answer --help" }

          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process -FilePath $unins.FullName -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\careertwin-overlay.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\careertwin-overlay.exe") { throw "uninstalling left the program behind" }
          if (Test-Path $link) { throw "uninstalling left the Start menu shortcut" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            release/*.zip
            release/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS dmg
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version of the window
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' overlay/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in overlay/Cargo.toml"
            exit 1
          fi

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            overlay/target
          key: release-macos-${{ hashFiles('overlay/Cargo.lock') }}

      - name: Build the app and the dmg
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          ./scripts/package_overlay.sh macos "$label"

      - name: Open the dmg and start the app inside it
        run: |
          dmg=$(ls dist/macos/*.dmg)
          mount="$RUNNER_TEMP/ct-dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$mount/CareerTwin Interview.app"
          codesign --verify --deep --strict "$app"
          # The launcher the Finder runs must make the data folder and start the program.
          home=$(mktemp -d)
          out=$(HOME="$home" "$app/Contents/MacOS/careertwin-interview" --version)
          echo "$out"
          case "$out" in "careertwin-overlay "*) ;; *) echo "unexpected output: $out"; exit 1 ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$out" != "careertwin-overlay ${GITHUB_REF_NAME#v}" ]; then
            echo "the program says $out but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          test -d "$home/Library/Application Support/CareerTwin Interview"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version of the window
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' overlay/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in overlay/Cargo.toml"
            exit 1
          fi

      - name: Cache the build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            overlay/target
          key: release-linux-${{ hashFiles('overlay/Cargo.lock') }}

      - name: Build and pack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          ./scripts/package_overlay.sh linux "$label"

      - name: Unpack it and ask it for its version
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf dist/linux/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/CareerTwin-Interview"
          for file in careertwin-overlay careertwin-interview-ctl install.sh careertwin-interview.desktop careertwin-interview.png README.txt; do
            test -e "$file" || { echo "the tarball lacks $file"; exit 1; }
          done
          out=$(./careertwin-overlay --version)
          echo "$out"
          case "$out" in "careertwin-overlay "*) ;; *) echo "unexpected output: $out"; exit 1 ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$out" != "careertwin-overlay ${GITHUB_REF_NAME#v}" ]; then
            echo "the program says $out but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          # the ctl command says plainly when no window runs
          if ./careertwin-interview-ctl ping 2>"$RUNNER_TEMP/ctl.txt"; then echo "ctl answered without a window"; exit 1; fi
          grep -q "not running" "$RUNNER_TEMP/ctl.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tarball
          path: dist/linux/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum -- * | tee SHA256SUMS.txt)
          notes="**Windows:** run the \`-setup.exe\` (no administrator rights needed), or unzip the \`.zip\` and start \`careertwin-overlay.exe\`. Windows may warn that the publisher is unknown: choose More info, then Run anyway. The window can keep itself out of screen sharing (Settings, General); many employers forbid AI help in an interview, so check their rules.

          **macOS (Apple silicon):** open the \`.dmg\`, drag the app to Applications, then right-click it and choose Open the first time. The app is not signed by Apple. Call audio is not on the Mac yet: type a question, use the microphone, or answer the screen.

          **Linux:** unpack the \`.tar.gz\` and run \`./install.sh\`. Hearing the call needs parec and pactl; a screenshot needs grim, spectacle, gnome-screenshot, maim or scrot.

          These are built and checked by GitHub's machines (the program starts and reports its version; Windows is installed and uninstalled). The parts that need a screen were tested without one. Nobody has tried the Windows and macOS builds by hand yet. Check a download against \`SHA256SUMS.txt\`."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --notes "$notes" $prerelease
          fi
