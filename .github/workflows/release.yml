name: Release

# A tag like v0.2.0 builds the portable Windows package and publishes it as a GitHub release.
# Run it by hand (Actions -> Release -> Run workflow) to get the zip as a build artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_windows.sh
      - packaging/windows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Cache the embeddable Python
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: windows-embed-${{ hashFiles('scripts/build_windows.sh') }}

      - name: Build the Windows package
        run: ./scripts/build_windows.sh

      - name: Name the archive after the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          name="CareerTwin-Interview-$label-windows-x64.zip"
          mkdir -p release
          mv dist/windows/CareerTwin-Interview-windows-x64.zip "release/$name"
          (cd release && sha256sum "$name" | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes $prerelease
          fi
