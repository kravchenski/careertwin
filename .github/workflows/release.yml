name: Release

# A tag like v0.2.0 builds the portable Windows zip, a Windows setup program (.exe) and a macOS
# disk image (.dmg), checks each one, and publishes them as a GitHub release. Run it by hand
# (Actions -> Release -> Run workflow) to get the files as build artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build_windows.sh
      - scripts/build_macos.sh
      - packaging/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Cache the embeddable Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/cache
          key: windows-embed-${{ hashFiles('scripts/build_windows.sh') }}

      - name: Build the Windows package
        run: ./scripts/build_windows.sh

      - name: Name the archive after the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          mkdir -p release
          mv dist/windows/CareerTwin-Interview-windows-x64.zip "release/CareerTwin-Interview-$label-windows-x64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: release/*
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows setup
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-zip
          path: portable

      - name: Unpack the portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem portable -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath build
          if (-not (Test-Path build\CareerTwin-Interview\start.pyw)) { throw "the zip has no CareerTwin-Interview folder" }

      - name: Build the setup program
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed" }
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          & $iscc "/DAppVersion=$label" "/DSourceDir=$PWD\build\CareerTwin-Interview" "/O$PWD\release" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem release | Format-Table Name, Length

      - name: Install it, start it, uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'ct-install'
          $run = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", "/LOG=$PWD\setup.log"
          if ($run.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "setup exited with $($run.ExitCode)" }

          foreach ($file in 'python\pythonw.exe', 'start.pyw', 'careertwin-interview.ico', 'site-packages\careertwin\interview\app.py') {
            if (-not (Test-Path "$dir\$file")) { throw "the installation lacks $file" }
          }
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CareerTwin Interview.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -notlike '*python\pythonw.exe' -or $shortcut.Arguments -notlike '*start.pyw*') {
            throw "the shortcut starts the wrong thing: $($shortcut.TargetPath) $($shortcut.Arguments)"
          }

          # What the installed program imports, and a real window drawn without a display.
          $env:QT_QPA_PLATFORM = 'offscreen'
          & "$dir\python\python.exe" -c "import PySide6.QtWidgets, faster_whisper, soundcard, httpx; from careertwin.interview.overlay import Bridge, OverlayWindow, create_app; app = create_app([]); w = OverlayWindow(Bridge()); w.show(); app.processEvents(); print('window', w.grab().width(), 'px')"
          if ($LASTEXITCODE -ne 0) { throw "the installed program does not start" }

          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process -FilePath $unins.FullName -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\python"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\python") { throw "uninstalling left the program behind" }
          if (Test-Path $link) { throw "uninstalling left the Start menu shortcut" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: release/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS dmg
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Build the app and the dmg
        run: ./scripts/build_macos.sh

      - name: Open the dmg and start the app inside it
        run: |
          dmg=$(ls dist/macos/*.dmg)
          mount="$RUNNER_TEMP/ct-dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$mount/CareerTwin Interview.app"
          codesign --verify --deep --strict "$app"
          home=$(mktemp -d)
          # The Python inside the app imports its packages and draws a window without a display. The
          # launcher normally says where the data goes; the dmg itself is read-only.
          CAREERTWIN_DATA_DIR="$home/data" QT_QPA_PLATFORM=offscreen \
            PYTHONPATH="$app/Contents/Resources/site-packages" PYTHONNOUSERSITE=1 \
            "$app/Contents/Resources/python/bin/python3" -c "import PySide6.QtWidgets, faster_whisper, httpx; from careertwin.interview.overlay import Bridge, OverlayWindow, create_app; app = create_app([]); w = OverlayWindow(Bridge()); w.show(); app.processEvents(); print('window', w.grab().width(), 'px')"
          # The launcher the Finder runs: it must create the data folder and start the program.
          HOME="$home" QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/careertwin-interview" --help
          grep -q usage "$home/Library/Application Support/CareerTwin Interview/last-run.log"
          hdiutil detach "$mount"

      - name: Name the dmg after the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          mkdir -p release
          mv dist/macos/*.dmg "release/CareerTwin-Interview-$label-macos-$(uname -m).dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-installer, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum -- * | tee SHA256SUMS.txt)
          notes="**Windows:** run the \`-setup.exe\` (no administrator rights needed), or unzip the \`.zip\` and start it with \`Start CareerTwin Interview.bat\`. Windows may warn that the publisher is unknown: choose More info, then Run anyway.

          **macOS (Apple silicon):** open the \`.dmg\`, drag the app to Applications, then right-click it and choose Open the first time. The app is not signed by Apple. Call audio is not on the Mac yet; typed questions, screenshots and project defense are expected to work (the build is checked by GitHub's machine, not tried by hand on a Mac).

          Check a download against \`SHA256SUMS.txt\`."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --notes "$notes" $prerelease
          fi
